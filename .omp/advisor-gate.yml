# Skill-to-advisor bindings for the advisor-gate extension.
# A key is a skill name. Its value lists advisors from the merged
# WATCHDOG.yml roster that must run while that skill is active.
#
# This file is project scoped. It applies only inside this repository.
#
# Use this file for skills you do not own. The skills under ~/.agents/skills
# come from mattpocock/skills, and a re-sync overwrites their frontmatter.
# A skill you own can declare `advisors:` in its own SKILL.md instead.
skills:
  code-review:
    - Security
    - Performance
