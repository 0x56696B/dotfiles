---
- name: "Window-Manager | {{ ansible_distribution }} | Aerospace"
  when: window_manager == "aerospace"
  block:
    - name: "Window-Manager | {{ ansible_distribution }} | Aerospace | Add tap to Homebrew"
      community.general.homebrew_tap:
        name: nikitabobko/tap

    - name: "Window-Manager | {{ ansible_distribution }} | Aerospace | Install"
      community.general.homebrew_cask:
        name:
          - aerospace
        state: latest

- name: "Window-Manager | {{ ansible_distribution }} | Yabai"
  when: window_manager == "yabai"
  block:
    - name: "Window-Manager | {{ ansible_distribution }} | Yabai | Dependencies"
      community.general.homebrew:
        name:
          - jq
        state: latest

    - name: "Window-Manager | {{ ansible_distribution }} | Yabai | Add tap to Homebrew"
      community.general.homebrew_tap:
        name: koekeishiya/formulae

    - name: "Window-Manager | {{ ansible_distribution }} | Yabai | Install"
      community.general.homebrew:
        name:
          - yabai
        state: latest

