# Reversible provider-boundary redaction. Enabled by secrets.enabled in
# config.yml. The obfuscator replaces the WHOLE regex match, so every
# pattern below uses a lookbehind and matches the VALUE only.
#
# NEVER add a `type: plain` literal secret here. This file is tracked in
# git and the agent is allowed to read it. Put literal secrets in a
# project-level .omp/secrets.yml, which stays hard-blocked and gitignored.
- type: regex
  friendlyName: EnvSecret
  mode: obfuscate
  flags: gim
  content: '(?<=^[ \t]*(?:export[ \t]+)?[A-Za-z_][A-Za-z0-9_]*(?:SECRET|TOKEN|PASSWORD|PASSWD|PWD|PASS|APIKEY|API_KEY|ACCESS_KEY|PRIVATE_KEY|CREDENTIAL)[A-Za-z0-9_]*[ \t]*=[ \t]*["'']?)(?!\*+\s*$)[^"''\r\n]{8,}'
- type: regex
  friendlyName: UrlCredential
  mode: obfuscate
  flags: g
  content: '(?<=://)[^:/?#\s@]+:(?!\*+@)[^@/?#\s]+(?=@)'
