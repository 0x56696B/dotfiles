symbolPreset: nerd
theme:
  dark: dark-aurora
  light: light
setupVersion: 2
statusLine:
  sessionAccent: true
  transparent: true
  compactThinkingLevel: true
  showHookStatus: true
  preset: default
  separator: slash
terminal:
  showProgress: true
tui:
  tight: true
  imeSafeCursor: false
display:
  shimmer: kitt
  showTokenUsage: true
  cacheMissMarker: false
  hideToolActivity: false
modelRoles:
  slow: anthropic/claude-opus-5
  plan: anthropic/claude-opus-5
  commit: orbit/zai/glm-4-7-flash
  tiny: orbit/google/gemma-3-27b
  task: anthropic/claude-sonnet-5
  default: anthropic/claude-sonnet-5
  smol: orbit/anthropic/claude-haiku-4-5
  advisor: anthropic/claude-opus-5
  search: anthropic/claude-haiku-4-5
  sonic: orbit/anthropic/claude-haiku-4-5
defaultThinkingLevel: auto
steeringMode: one-at-a-time
doubleEscapeAction: none
features:
  unexpectedStopDetection: smart
tools:
  xdev: false
  approval:
    mcp__playwright_browser_evaluate: deny
    mcp__playwright_browser_run_code_unsafe: deny
    mcp__playwright_browser_network_request: deny
    mcp__playwright_browser_network_requests: deny
    mcp__playwright_browser_console_messages: deny
showHardwareCursor: true
task:
  showResolvedModelBadge: false
  eager: preferred
  enableLsp: true
  isolation:
    mode: auto
  agentAdvisor:
    task: "on"
proseOnlyThinking: true
omitThinking: false
advisor:
  enabled: true
  syncBacklog: "3"
  immuneTurns: 1
retry:
  maxRetries: 3
  fallbackChains:
    commit:
      - orbit/deepseek/deepseek-v3-2
    tiny:
      - orbit/deepseek/deepseek-v3-2
includeModelInPrompt: false
recap:
  enabled: true
stt:
  enabled: true
startup:
  quiet: true
  changelogMode: summary
  checkUpdate: false
branchSummary:
  enabled: false
compaction:
  enabled: false
  midTurnEnabled: false
  thresholdPercent: 75
  handoffSaveToDisk: false
  remoteStreamingV2Enabled: true
  methodOrder:
    - handoff
    - remote
    - soft
    - snapcompact
    - shake
autolearn:
  enabled: false
  autoContinue: true
readLineNumbers: true
lsp:
  formatOnWrite: true
  diagnosticsOnEdit: true
bashInterceptor:
  enabled: true
python:
  kernelMode: session
astGrep:
  enabled: true
checkpoint:
  enabled: false
vault:
  enabled: true
commands:
  enableOpencodeProject: false
  enableOpencodeUser: false
  enableClaudeProject: false
  enableClaudeUser: false
providers:
  tts: local
  webSearchOrder:
    []
  autoThinkingMaxEffort: max
disabledProviders:
  - llama.cpp
  - lm-studio
speech:
  enabled: false
  enhanced: true
secrets:
  enabled: true
magicKeywords:
  ultrathink: true
memory:
  backend: local
speechgen:
  enabled: false
extensions:
  - ~/.bun/install/global/node_modules/@oh-my-pi/swarm-extension
hideThinkingBlock: true
model:
  toolCallLoopGuard:
    enabled: true
dev:
  autoqaConsent: granted
cycleOrder:
  []
colorBlindMode: false
personality: none
textVerbosity: low
mcp:
  notifications: false
astEdit:
  enabled: true
todo:
  eager: preferred
grep:
  contextBefore: 3
power:
  sleepPrevention: system
disabledExtensions:
  - skill:realoem-bmw-part-crossref
tier:
  anthropic: none
security:
  enabled: false
shellPath: /bin/zsh
browser:
  relay: false
  enabled: false
edit:
  autoRepair:
    enabled: true
treeFilterMode: default
emojiAutocomplete: false
error:
  notify: "on"
# Read by ~/.omp/agent/extensions/vibe-extra-tools.ts, not by the harness itself.
# Each tool named here is added back to the director in vibe mode, in every
# project. Unioned with the same key in a project's .omp/config.yml.
vibeExtraTools:
  - move_session
