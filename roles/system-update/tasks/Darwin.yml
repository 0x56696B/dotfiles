---
- name: "System Update | {{ ansible_distribution }} | Update Homebrew"
  tags:
    - homebrew
  block:
    - name: "System Update | {{ ansible_distribution }} | Update Homebrew itself"
      community.general.homebrew:
        update_homebrew: true
      register: homebrew_update_result
      changed_when: "'Homebrew already up-to-date' not in homebrew_update_result.msg"

    - name: "System Update | {{ ansible_distribution }} | Update Homebrew packages"
      community.general.homebrew:
        upgrade_all: true
      register: homebrew_packages_update_result
      changed_when: "'Homebrew packages already upgraded' not in homebrew_packages_update_result.msg"

    - name: "System Update | {{ ansible_distribution }} | Update Homebrew Casks"
      community.general.homebrew_cask:
        upgrade_all: true
      register: homebrew_casks_update_result
      changed_when: "'Homebrew casks already upgraded' not in homebrew_casks_update_result.msg"

- name: "System Update | {{ ansible_distribution }} | Update Apps from App Store"
  tags:
    - app-store
  ansible.builtin.command: mas upgrade
  register: mas_upgrade_result
  changed_when: mas_upgrade_result.stdout != ''

- name: "System Update | {{ ansible_distribution }} | Update Neovim"
  tags:
    - neovim
  block:
    - name: "System Update | {{ ansible_distribution }} | Update Neovim Lazy plugins"
      ansible.builtin.shell: |
        nvim --headless "+Lazy! sync" +qa
      register: neovim_lazy_result
      failed_when: neovim_lazy_result.rc != 0
      changed_when: >
        (neovim_lazy_result.stdout | default('')) is search('Installed|Updated|Removed|Cleaning') or
        (neovim_lazy_result.stderr | default('')) is search('Installed|Updated|Removed|Cleaning')
      tags:
        - lazy

    - name: "System Update | {{ ansible_distribution }} | Update Neovim Mason registry"
      tags:
        - mason
      ansible.builtin.shell: |
        nvim --headless "+MasonUpdate" +qa
      register: neovim_mason_result
      failed_when: neovim_mason_result.rc != 0
      # Mason isn't great at printing a stable "no-op" token; assume change if it mentions installs/updates.
      changed_when: >
        (neovim_mason_result.stdout | default('')) is search('Installing|Installed|Updating|Updated|Uninstalling|Uninstalled') or
        (neovim_mason_result.stderr | default('')) is search('Installing|Installed|Updating|Updated|Uninstalling|Uninstalled')

    # FIXME: Blocks and doesn't work properly
    # - name: "System Update | {{ ansible_distribution }} | Update Neovim Mason packages"
    #   tags:
    #     - mason
    #   ansible.builtin.shell: |
    #     nvim --headless "+MasonToolsUpdateSync" +qa
    #   register: neovim_mason_result
    #   failed_when: neovim_mason_result.rc != 0
    #   # Mason isn't great at printing a stable "no-op" token; assume change if it mentions installs/updates.
    #   changed_when: >
    #     (neovim_mason_result.stdout | default('')) is search('Installing|Installed|Updating|Updated|Uninstalling|Uninstalled') or
    #     (neovim_mason_result.stderr | default('')) is search('Installing|Installed|Updating|Updated|Uninstalling|Uninstalled')

    - name: "System Update | {{ ansible_distribution }} | Update Neovim TreeSitter"
      tags:
        - treesitter
      ansible.builtin.shell: |
        nvim --headless "+TSUpdateSync" +qa
      register: neovim_ts_result
      failed_when: neovim_ts_result.rc != 0
      changed_when: >
        (neovim_ts_result.stdout | default('')) is search('Updated|Installing|Installed|Uninstalled') or
        (neovim_ts_result.stderr | default('')) is search('Updated|Installing|Installed|Uninstalled')

- name: "System Update | {{ ansible_distribution }} | Update ZInit"
  ansible.builtin.shell: |
    ZINIT_ZSH="$HOME/.local/share/zinit/zinit.git/zinit.zsh"
    test -f "$ZINIT_ZSH"

    zsh -lc '
      source "$HOME/.local/share/zinit/zinit.git/zinit.zsh"
      zinit self-update
      zinit update -a -q
    '
  args:
    chdir: "{{ ansible_user_dir }}"
    executable: /bin/zsh
  register: zinit_update_result
  changed_when: >
    (
      (zinit_update_result.stdout | default('')) is search('Updated|Updating')
    )
  failed_when: >
    zinit_update_result.rc != 0
  tags:
    - zinit

- name: "System Update | {{ ansible_distribution }} | Check for Software Updates"
  ansible.builtin.command: softwareupdate -l
  register: update_list
  changed_when: "'No new software available.' not in update_list.stderr"
  become: true
  become_user: root

- name: "System Update | {{ ansible_distribution }} | Update MacOS"
  when: "'No new software available.' not in update_list.stderr"
  # when: update_list.stdout.find("No new software available") == -1
  become: true
  become_user: root
  block:
    - name: "System Update | {{ ansible_distribution }} | Download System Update"
      ansible.builtin.command: softwareupdate -d -a --agree-to-license
      register: update_result
      changed_when: >
        'No updates are available.' not in (update_result.stdout | default('')) and
        'No updates are available.' not in (update_result.stderr | default(''))

