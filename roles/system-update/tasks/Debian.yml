---
- name: "System Update | {{ ansible_distribution }} | Update packages from APT"
  ansible.builtin.apt:
    upgrade: "safe"
    update_cache: yes
    cache_valid_time: 3600
  become: true
  become_user: root

- name: "System Update | {{ ansible_distribution }} | Update Neovim"
  ansible.builtin.include_role:
    name: neovim
    tasks_from: update/Debian
    apply:
      tags:
        - neovim
  tags:
    - neovim

- name: "System Update | {{ ansible_distribution }} | Update ZInit"
  ansible.builtin.include_role:
    name: zsh
    tasks_from: update/Debian
    apply:
      tags:
        - zsh
  tags:
    - zsh

- name: "System Update | {{ ansible_distribution }} | Update Tmux"
  ansible.builtin.include_role:
    name: tmux
    tasks_from: update/Debian
    apply:
      tags:
        - tmux
  tags:
    - tmux

- name: "System Update | {{ ansible_distribution }} | Update System"
  ansible.builtin.apt:
    autoclean: true
    autoremove: true
    upgrade: "full"
  become: true
  become_user: root
