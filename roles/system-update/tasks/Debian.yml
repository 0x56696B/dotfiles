---
- name: "System Update | {{ ansible_distribution }} | Update packages from APT"
  ansible.builtin.apt:
    upgrade: "safe"
    update_cache: yes
    cache_valid_time: 3600
  become: true
  become_user: root

- name: "System Update | {{ ansible_distribution }} | Update Neovim"
  ansible.builtin.include_role:
    name: neovim
    tasks_from: update/Debian
    apply:
      tags:
        - neovim
  tags:
    - neovim

- name: "System Update | {{ ansible_distribution }} | Update ZInit"
  ansible.builtin.shell: |
    source $HOME/.zshrc
    source $HOME/.zshenv

    zinit update -a -p
  args:
    executable: /bin/zsh

- name: "System Update | {{ ansible_distribution }} | Update System"
  ansible.builtin.apt:
    autoclean: true
    autoremove: true
    upgrade: "full"
  become: true
  become_user: root
