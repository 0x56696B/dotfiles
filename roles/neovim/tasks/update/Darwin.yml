- name: "Neovim | {{ ansible_distribution }} | Update TreeSitter"
  tags:
    - treesitter
  ansible.builtin.shell: |
    nvim --headless "+TSUpdateSync" +qa
  register: neovim_ts_result
  failed_when: neovim_ts_result.rc != 0
  changed_when: >
    (neovim_ts_result.stdout | default('')) is search('Updated|Installing|Installed|Uninstalled') or
    (neovim_ts_result.stderr | default('')) is search('Updated|Installing|Installed|Uninstalled')
